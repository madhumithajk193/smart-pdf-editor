
spring.application.name=backend

# Server port required by Render
server.port=${PORT:8080}

# Database: supplied through Render environment variables
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
# MySQL dialect is detected automatically

# Multipart
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# Logging
logging.level.org.springframework.security=INFO

# Actuator
management.endpoints.web.exposure.include=health,info

# Temporary upload directory on the server
app.upload.dir=${APP_UPLOAD_DIR:/tmp/pdf-editor/uploads}
